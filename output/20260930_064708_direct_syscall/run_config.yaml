behavior_rules:
  directory: C:\Users\mslr74l\Desktop\dev\behaviorBypassAgent\windowsBehaviorRules
  enabled: true
compiler:
  guidelines:
    csharp:
    - Use standard C# patterns and avoid unsafe code unless explicitly required.
    python:
    - Ensure 64-bit compatibility. The shellcode is x64. When using ctypes on 64-bit
      Windows, you MUST explicitly define `.argtypes` and `.restype` (e.g., `ctypes.wintypes.HMODULE`,
      `ctypes.c_void_p`) for all Windows APIs to prevent 64-bit pointers from being
      truncated to 32-bit integers.
    - Always cast memory addresses to `ctypes.c_void_p()` before passing them to Windows
      APIs like `VirtualProtect` to avoid pointer truncation.
    - Do not print raw bytes or parsed memory strings (like PE section names) to the
      console to avoid UnicodeEncodeError on Windows.
    c:
    - Emit one complete compilable translation unit including ALL required headers;
      no stubs, TODOs, or pseudocode. Verify braces balance before finishing the file.
    - Use `int main(int argc, char* argv[])` and read the payload path from argv[1].
      If you choose wmain/wWinMain (wide args), you MUST use wide CRT functions (_wfopen,
      wcslen, wprintf); passing wchar_t* argv to narrow functions like fopen/printf
      %s reads garbage such as just "C".
    - The target is x64 Windows and the code must compile cleanly under MSVC cl.exe.
      Do not use GCC-only extensions (e.g. __attribute__) and do not use C++ constructs.
    - Prefer documented Win32 APIs from <windows.h>. If undocumented NT APIs (Nt*/Zw*/Rtl*
      functions or types like OBJECT_ATTRIBUTES/IO_STATUS_BLOCK) are required, you
      MUST declare every typedef, enum, and function prototype yourself; <winternl.h>
      alone does NOT define most of them.
    - Keep helper declarations above their call sites and ensure every identifier
      used is declared; cl.exe does not tolerate forward references to undeclared
      functions.
    - The loader's only job is executing the payload bytes from argv[1]; never spawn
      or search for the observable target process (calc.exe/CalculatorApp.exe) yourself
      — the payload produces it. If a technique needs a host process, spawn a real
      executable (e.g. C:\Windows\System32\notepad.exe), NOT a UWP alias like CalculatorApp.exe
      which cannot be CreateProcess'd (error 2).
  language: c
  mingw:
    path: C:\mingw64\bin\gcc.exe
  msvc:
    vcvars_path: C:\Program Files\Microsoft Visual Studio\18\Community\VC\Auxiliary\Build\vcvars64.bat
  output_dir: ./output
  type: msvc
